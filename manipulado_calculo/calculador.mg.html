<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Formulações – Farmácia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fc; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { color: #2c3e50; margin-bottom: 5px; }
    p.sub { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; min-width: 130px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 4px; }
    .form-group input, .form-group select { padding: 8px 10px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
    .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
    .btn-add { background: #27ae60; color: white; }
    .btn-add:hover { background: #219a52; }
    .btn-clear { background: #e74c3c; color: white; margin-left: 8px; }
    .btn-clear:hover { background: #c0392b; }
    .btn-remove { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; padding: 4px 10px; font-size: 12px; }
    .btn-remove:hover { background: #e74c3c; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th { background: #ecf0f1; color: #2c3e50; font-weight: 600; padding: 10px; text-align: left; }
    td { padding: 8px 10px; border-bottom: 1px solid #ecf0f1; }
    .total-row { font-weight: bold; background: #f8f9fa; }
    .total-row td { border-top: 2px solid #bdc3c7; }
    .empty-message { text-align: center; color: #95a5a6; padding: 30px; }
    .badge { background: #3498db; color: white; border-radius: 4px; padding: 2px 6px; font-size: 11px; margin-left: 6px; }
    .info-unit { background: #f0f0f0; padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #555; }
    @media (max-width: 750px) {
      .form-row { flex-direction: column; }
      .form-group { min-width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🧪 Calculadora de Formulações</h1>
  <p class="sub">Base de dados unificada. Escolha o insumo, a unidade correta e a quantidade de doses.</p>

  <div class="form-row">
    <div class="form-group" style="flex:1;">
      <label>Insumo (digite para buscar)</label>
      <input type="text" id="buscaInsumo" list="listaInsumos" placeholder="Ex: paracetamol, cafeína..." autocomplete="off">
      <datalist id="listaInsumos"></datalist>
    </div>
    <div class="form-group">
      <label>Dosagem</label>
      <input type="number" id="dosagem" step="any" min="0" placeholder="0" style="width:100px;">
    </div>
    <div class="form-group">
      <label>Unidade</label>
      <select id="unidadeDosagem">
        <option value="mg" selected>mg</option>
        <option value="g">g</option>
        <option value="mL">mL</option>
        <option value="UI">UI</option>
        <option value="mcg">mcg</option>
      </select>
    </div>
    <div class="form-group">
      <label>Qtd. cápsulas/doses</label>
      <input type="number" id="quantidade" min="1" value="1" step="1" style="width:80px;">
    </div>
    <button class="btn btn-add" id="btnAdicionar">+ Adicionar</button>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h3 style="color: #2c3e50;">📋 Fórmula atual</h3>
    <button class="btn btn-clear" id="btnLimpar">🗑 Limpar tudo</button>
  </div>

  <table id="tabelaFormula">
    <thead>
      <tr>
        <th>Insumo</th>
        <th>Dosagem</th>
        <th>Unid.</th>
        <th>Preço Unit.</th>
        <th>Custo Dose</th>
        <th>Qtd.</th>
        <th>Custo Total</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="corpoTabela">
      <tr class="empty-message"><td colspan="8">Nenhum insumo adicionado ainda.</td></tr>
    </tbody>
    <tfoot id="rodapeTabela" style="display: none;">
      <tr class="total-row">
        <td colspan="6" style="text-align: right;">Custo total da fórmula ➔</td>
        <td id="totalGeral">R$ 0,00</td>
        <td></td>
      </tr>
    </tfoot>
  </table>
</div>

  // Extrai nome e preço (formato brasileiro: vírgula como decimal)
  const regex = /([^\d,]+?)\s+(\d+,\d+)/g;
  let match;
  while ((match = regex.exec(textoBruto)) !== null) {
    const nome = match[1].trim();
    const preco = parseFloat(match[2].replace(',', '.'));
    if (nome && !isNaN(preco)) {
      insumos.push({ nome, preco });
    }
  }

  // ====================== LÓGICA DA APLICAÇÃO ======================
  let itensFormula = [];

  const buscaInput = document.getElementById('buscaInsumo');
  const dataList = document.getElementById('listaInsumos');
  const dosagemInput = document.getElementById('dosagem');
  const unidadeSelect = document.getElementById('unidadeDosagem');
  const quantidadeInput = document.getElementById('quantidade');
  const btnAdicionar = document.getElementById('btnAdicionar');
  const btnLimpar = document.getElementById('btnLimpar');
  const corpoTabela = document.getElementById('corpoTabela');
  const rodapeTabela = document.getElementById('rodapeTabela');
  const totalGeralSpan = document.getElementById('totalGeral');

  // Preenche o datalist com todos os insumos
  function preencherDatalist() {
    dataList.innerHTML = '';
    insumos.forEach(item => {
      const option = document.createElement('option');
      option.value = item.nome;
      dataList.appendChild(option);
    });
  }

  buscaInput.addEventListener('input', () => {
    // Apenas para mostrar o datalist, sem ação adicional
  });

  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function atualizarTabela() {
    corpoTabela.innerHTML = '';
    if (itensFormula.length === 0) {
      corpoTabela.innerHTML = '<tr class="empty-message"><td colspan="8">Nenhum insumo adicionado ainda.</td></tr>';
      rodapeTabela.style.display = 'none';
      return;
    }

    let totalGeral = 0;
    itensFormula.forEach((item, index) => {
      const custoDose = item.dosagem * item.preco;
      const custoTotal = custoDose * item.quantidade;
      totalGeral += custoTotal;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${item.nome}</td>
        <td>${item.dosagem}</td>
        <td>${item.unidade}</td>
        <td>${formatarMoeda(item.preco)}</td>
        <td>${formatarMoeda(custoDose)}</td>
        <td>${item.quantidade}</td>
        <td>${formatarMoeda(custoTotal)}</td>
        <td><button class="btn btn-remove" data-index="${index}">✕</button></td>
      `;
      corpoTabela.appendChild(row);
    });

    totalGeralSpan.textContent = formatarMoeda(totalGeral);
    rodapeTabela.style.display = 'table-footer-group';

    document.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.target.getAttribute('data-index'));
        itensFormula.splice(idx, 1);
        atualizarTabela();
        salvarLocalStorage();
      });
    });
  }

  function adicionarInsumo() {
    const nome = buscaInput.value.trim();
    const encontrado = insumos.find(item => item.nome.toLowerCase() === nome.toLowerCase());

    if (!encontrado) {
      alert('Selecione um insumo válido da lista.');
      return;
    }

    const dosagem = parseFloat(dosagemInput.value);
    if (isNaN(dosagem) || dosagem <= 0) {
      alert('Informe uma dosagem válida.');
      return;
    }

    const quantidade = parseInt(quantidadeInput.value);
    if (isNaN(quantidade) || quantidade <= 0) {
      alert('Informe a quantidade de cápsulas/doses.');
      return;
    }

    const unidade = unidadeSelect.value;

    itensFormula.push({
      nome: encontrado.nome,
      dosagem: dosagem,
      unidade: unidade,
      preco: encontrado.preco,
      quantidade: quantidade
    });

    // Limpa campos
    buscaInput.value = '';
    dosagemInput.value = '';
    quantidadeInput.value = '1';

    atualizarTabela();
    salvarLocalStorage();
  }

  function limparTudo() {
    if (confirm('Deseja realmente limpar toda a fórmula?')) {
      itensFormula = [];
      atualizarTabela();
      salvarLocalStorage();
    }
  }

  function salvarLocalStorage() {
    localStorage.setItem('itensFormula', JSON.stringify(itensFormula));
  }

  function carregarLocalStorage() {
    const dados = localStorage.getItem('itensFormula');
    if (dados) {
      itensFormula = JSON.parse(dados);
      atualizarTabela();
    }
  }

  // Eventos
  btnAdicionar.addEventListener('click', adicionarInsumo);
  btnLimpar.addEventListener('click', limparTudo);

  dosagemInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') adicionarInsumo();
  });
  quantidadeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') adicionarInsumo();
  });
  buscaInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      dosagemInput.focus();
    }
  });

  // Inicialização
  preencherDatalist();
  carregarLocalStorage();
</script>
