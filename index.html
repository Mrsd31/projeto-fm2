<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PharmaPOS - PDV Profissional 3D</title>
    <!-- Google Fonts e Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Biblioteca Three.js para efeito 3D -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a1f1a;
            overflow: hidden;
            color: #e0f2e9;
        }

        /* Canvas 3D de fundo */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Permite clicar nos elementos da UI */
        }

        /* Interface principal do PDV */
        .pos-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            height: 100vh;
            width: 100%;
            backdrop-filter: blur(3px);
            background: rgba(10, 30, 25, 0.45);
            overflow-y: auto;
            padding: 20px;
            gap: 24px;
        }

        /* Painel de produtos (esquerda/principal) */
        .products-panel {
            flex: 3;
            min-width: 280px;
            background: rgba(18, 35, 30, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(72, 187, 120, 0.4);
            box-shadow: 0 25px 40px -15px rgba(0,0,0,0.4), 0 0 0 1px rgba(72, 187, 120, 0.2) inset;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }

        /* Cabeçalho da farmácia */
        .pharma-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(72, 187, 120, 0.5);
        }
        .pharma-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c0f2d8, #48bb78);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .pharma-header span {
            font-size: 0.85rem;
            background: #2d6a4f60;
            padding: 6px 12px;
            border-radius: 60px;
            font-weight: 500;
        }

        /* Barra de busca */
        .search-bar {
            background: rgba(0,0,0,0.45);
            border-radius: 60px;
            display: flex;
            align-items: center;
            padding: 8px 18px;
            margin-bottom: 25px;
            border: 1px solid #48bb7840;
            transition: all 0.2s;
        }
        .search-bar i {
            color: #48bb78;
            font-size: 1.2rem;
            margin-right: 12px;
        }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1rem;
            width: 100%;
            font-weight: 500;
        }
        .search-bar input::placeholder {
            color: #a0c0b0;
        }

        /* Grid de produtos com efeito 3D sutil */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
            overflow-y: auto;
            max-height: calc(100vh - 210px);
            padding: 4px 2px;
        }
        .product-card {
            background: rgba(30, 50, 45, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.2s;
            border: 1px solid rgba(72, 187, 120, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transform-style: preserve-3d;
        }
        .product-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #48bb78;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5), 0 0 12px rgba(72,187,120,0.4);
            background: rgba(40, 70, 60, 0.85);
        }
        .product-icon {
            font-size: 2.4rem;
            background: #1f3d35;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #48bb78;
            box-shadow: inset 0 -2px 0 #2c6e4e, 0 6px 12px rgba(0,0,0,0.2);
        }
        .product-card h4 {
            font-size: 1rem;
            font-weight: 600;
            margin: 8px 0 4px;
        }
        .product-price {
            font-weight: 700;
            color: #b2f0c7;
            font-size: 1.2rem;
            margin-top: 5px;
        }
        .product-stock {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* Painel do carrinho (direita) */
        .cart-panel {
            flex: 1.2;
            min-width: 300px;
            background: rgba(12, 28, 23, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(72, 187, 120, 0.5);
            box-shadow: 0 25px 35px -12px black;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .cart-title {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #48bb78;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            max-height: 55vh;
            margin-bottom: 20px;
            padding-right: 5px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.35);
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 24px;
            backdrop-filter: blur(4px);
            border-left: 4px solid #48bb78;
            transition: 0.1s;
        }
        .cart-item-info {
            flex: 2;
        }
        .cart-item-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .cart-item-price {
            font-size: 0.8rem;
            color: #b0dfc0;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1c3a30;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .cart-item-qty button {
            background: none;
            border: none;
            color: #48bb78;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            width: 28px;
            border-radius: 50%;
            transition: 0.1s;
        }
        .cart-item-qty button:hover {
            background: #2d6a4f;
            color: white;
        }
        .cart-item-qty span {
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }
        .cart-item-remove {
            background: none;
            border: none;
            color: #e68a7c;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 12px;
            transition: 0.1s;
        }
        .cart-item-remove:hover {
            color: #ff8a6c;
            transform: scale(1.1);
        }
        .cart-total {
            background: #10261f;
            padding: 20px;
            border-radius: 28px;
            margin-top: 12px;
            border-top: 1px solid #48bb78;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #dcfce8;
        }
        .checkout-btn {
            background: linear-gradient(95deg, #2b7a4b, #48bb78);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #0f2c20;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .checkout-btn:hover {
            transform: scale(0.98);
            background: linear-gradient(95deg, #3c9b64, #5fd18f);
            box-shadow: 0 8px 18px rgba(0,0,0,0.4);
        }
        .empty-cart {
            text-align: center;
            opacity: 0.7;
            padding: 40px 0;
        }

        /* Notificação flutuante */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3a2f;
            backdrop-filter: blur(16px);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 200;
            border-left: 5px solid #48bb78;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: 0.9rem;
        }

        /* scroll personalizado */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a342c;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #48bb78;
            border-radius: 8px;
        }
        @media (max-width: 780px) {
            .pos-container {
                flex-direction: column;
                padding: 12px;
            }
            .products-grid {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="pos-container">
        <!-- Painel de Produtos -->
        <div class="products-panel">
            <div class="pharma-header">
                <h1><i class="fas fa-prescription-bottle-alt"></i> PharmaPOS 3D</h1>
                <span><i class="fas fa-shield-alt"></i> Farmácia Profissional</span>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar medicamentos, produtos...">
            </div>
            <div class="products-grid" id="productsGrid">
                <!-- Produtos serão injetados via JS -->
            </div>
        </div>

        <!-- Painel do Carrinho -->
        <div class="cart-panel">
            <div class="cart-title">
                <i class="fas fa-shopping-cart"></i> Carrinho de Compras
                <span style="font-size:0.8rem; background:#2d6a4f; padding:2px 10px; border-radius:50px;" id="cartCount">0</span>
            </div>
            <div class="cart-items" id="cartItemsContainer">
                <div class="empty-cart">🛒 Seu carrinho está vazio</div>
            </div>
            <div class="cart-total">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="cartTotalValue">R$ 0,00</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn"><i class="fas fa-credit-card"></i> Finalizar Venda</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-msg" style="opacity:0; visibility:hidden;"></div>

    <script type="module">
        import * as THREE from 'three';

        // ---------- Configuração do Fundo 3D Profissional (Farmacia Elegante) ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x071a14);
        scene.fog = new THREE.FogExp2(0x071a14, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // sombras realistas
        container.appendChild(renderer.domElement);

        // Luzes profissionais
        // Ambiente suave
        const ambientLight = new THREE.AmbientLight(0x223d33);
        scene.add(ambientLight);
        // Luz principal direcional
        const dirLight = new THREE.DirectionalLight(0xd9f0e6, 1.2);
        dirLight.position.set(4, 8, 3);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);
        // Luz de preenchimento traseira
        const backLight = new THREE.PointLight(0x48bb78, 0.5);
        backLight.position.set(-2, 1, -4);
        scene.add(backLight);
        // Luz de realce colorida (verde)
        const fillLight = new THREE.PointLight(0x2b7a4b, 0.6);
        fillLight.position.set(2, 2, 3);
        scene.add(fillLight);
        
        // Elementos 3D: piso sutil
        const gridHelper = new THREE.GridHelper(15, 20, 0x48bb78, 0x2c5a4a);
        gridHelper.position.y = -1.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // Anel giratório / partículas elegantes
        const ringGeo = new THREE.TorusGeometry(1.8, 0.05, 64, 300);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x48bb78, emissive: 0x1a5a3a, emissiveIntensity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.6;
        scene.add(ring);
        
        const ring2Geo = new THREE.TorusGeometry(2.5, 0.04, 64, 300);
        const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x70cf9a, emissive: 0x216e48 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 2 + 0.2;
        ring2.position.y = -0.4;
        scene.add(ring2);
        
        // Cubos flutuantes (cápsulas decorativas)
        const capsuleGroup = [];
        const colors = [0x48bb78, 0x6bcb96, 0x3f9b6e];
        for (let i = 0; i < 18; i++) {
            const size = 0.12 + Math.random() * 0.1;
            const geometry = new THREE.BoxGeometry(size, size * 1.8, size);
            const material = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], emissive: 0x174d34, emissiveIntensity: 0.2 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.x = (Math.random() - 0.5) * 6;
            cube.position.z = (Math.random() - 0.5) * 5;
            cube.position.y = -0.8 + Math.random() * 2.5;
            cube.castShadow = true;
            scene.add(cube);
            capsuleGroup.push(cube);
        }
        
        // Adicionar um globo de vidro ou partículas flutuantes
        const particleCount = 600;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 14;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 5;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 12 - 3;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0x68c994, size: 0.04, transparent: true, opacity: 0.5 });
        const particles = new THREE.Points(particlesGeometry, particleMaterial);
        scene.add(particles);
        
        // animação 3D
        let time = 0;
        function animate3D() {
            requestAnimationFrame(animate3D);
            time += 0.008;
            ring.rotation.z = time * 0.3;
            ring2.rotation.z = -time * 0.2;
            ring.rotation.y = time * 0.2;
            ring2.rotation.y = time * 0.15;
            particles.rotation.y = time * 0.05;
            particles.rotation.x = Math.sin(time * 0.1) * 0.1;
            capsuleGroup.forEach((c, idx) => {
                c.rotation.x += 0.01;
                c.rotation.y += 0.02;
                c.position.y += Math.sin(time + idx) * 0.002;
            });
            camera.lookAt(0, 0.5, 0);
            camera.position.x += (Math.sin(time * 0.1) * 0.1 - (camera.position.x - 5)) * 0.02;
            camera.position.y += (Math.sin(time * 0.2) * 0.05 + 2.8 - camera.position.y) * 0.02;
            renderer.render(scene, camera);
        }
        animate3D();
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ---------- LÓGICA DO PDV (CARRINHO E PRODUTOS) ----------
        // Lista de produtos da farmácia (moderna)
        const produtos = [
            { id: 1, nome: "Paracetamol 750mg", preco: 12.90, estoque: 45, icone: "fas fa-tablets", categoria: "analgesico" },
            { id: 2, nome: "Ibuprofeno 600mg", preco: 19.90, estoque: 32, icone: "fas fa-capsules", categoria: "anti-inflamatorio" },
            { id: 3, nome: "Dipirona Sódica", preco: 8.50, estoque: 60, icone: "fas fa-syringe", categoria: "analgesico" },
            { id: 4, nome: "Amoxicilina 500mg", preco: 34.90, estoque: 25, icone: "fas fa-pills", categoria: "antibiotico" },
            { id: 5, nome: "Vitamina C 1g", preco: 24.50, estoque: 40, icone: "fas fa-apple-alt", categoria: "vitaminas" },
            { id: 6, nome: "Losartana 50mg", preco: 28.90, estoque: 18, icone: "fas fa-heartbeat", categoria: "cardiovascular" },
            { id: 7, nome: "Omeprazol 20mg", preco: 22.30, estoque: 27, icone: "fas fa-stethoscope", categoria: "gastro" },
            { id: 8, nome: "Curativo Adesivo", preco: 6.90, estoque: 120, icone: "fas fa-band-aid", categoria: "curativos" },
            { id: 9, nome: "Álcool em Gel 70%", preco: 14.90, estoque: 55, icone: "fas fa-hand-holding-heart", categoria: "higiene" },
            { id: 10, nome: "Máscara Descartável", preco: 9.90, estoque: 200, icone: "fas fa-head-side-mask", categoria: "protecao" }
        ];

        let cart = []; // { id, nome, preco, quantidade }
        let searchTerm = "";

        // DOM Elements
        const productsGrid = document.getElementById("productsGrid");
        const searchInput = document.getElementById("searchInput");
        const cartItemsContainer = document.getElementById("cartItemsContainer");
        const cartTotalValueSpan = document.getElementById("cartTotalValue");
        const cartCountSpan = document.getElementById("cartCount");
        const checkoutBtn = document.getElementById("checkoutBtn");

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.style.backgroundColor = isError ? "#5c2e2a" : "#1e3a2f";
            toast.style.borderLeftColor = isError ? "#e6856e" : "#48bb78";
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
            toast.style.opacity = "1";
            toast.style.visibility = "visible";
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.style.visibility = "hidden", 300);
            }, 2200);
        }

        function renderProducts() {
            let filtered = produtos.filter(p => p.nome.toLowerCase().includes(searchTerm.toLowerCase()) || p.categoria.includes(searchTerm.toLowerCase()));
            if (filtered.length === 0) {
                productsGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px;">🔍 Nenhum produto encontrado</div>`;
                return;
            }
            productsGrid.innerHTML = filtered.map(prod => `
                <div class="product-card" data-id="${prod.id}">
                    <div class="product-icon"><i class="${prod.icone}"></i></div>
                    <h4>${prod.nome}</h4>
                    <div class="product-price">R$ ${prod.preco.toFixed(2)}</div>
                    <div class="product-stock"><i class="fas fa-boxes"></i> ${prod.estoque} und.</div>
                </div>
            `).join('');
            // adicionar eventos aos cards
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const id = parseInt(card.dataset.id);
                    addToCart(id);
                });
            });
        }

        function addToCart(productId) {
            const produto = produtos.find(p => p.id === productId);
            if (!produto) return;
            const existingItem = cart.find(item => item.id === productId);
            const currentQtyInCart = existingItem ? existingItem.quantidade : 0;
            if (currentQtyInCart + 1 > produto.estoque) {
                showToast(`Estoque insuficiente! Disponível: ${produto.estoque}`, true);
                return;
            }
            if (existingItem) {
                existingItem.quantidade++;
            } else {
                cart.push({ id: produto.id, nome: produto.nome, preco: produto.preco, quantidade: 1 });
            }
            updateCartUI();
            showToast(`${produto.nome} adicionado ao carrinho.`);
        }

        function updateCartUI() {
            // Atualizar contador e total
            const totalItens = cart.reduce((acc, item) => acc + item.quantidade, 0);
            cartCountSpan.innerText = totalItens;
            const totalValue = cart.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            cartTotalValueSpan.innerText = `R$ ${totalValue.toFixed(2)}`;
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<div class="empty-cart">🛒 Seu carrinho está vazio</div>`;
                return;
            }
            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item" data-id="${item.id}">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.nome}</div>
                        <div class="cart-item-price">R$ ${item.preco.toFixed(2)}</div>
                    </div>
                    <div class="cart-item-qty">
                        <button class="qty-minus" data-id="${item.id}">-</button>
                        <span>${item.quantidade}</span>
                        <button class="qty-plus" data-id="${item.id}">+</button>
                    </div>
                    <button class="cart-item-remove" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
            // adicionar eventos dinâmicos
            document.querySelectorAll('.qty-minus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    changeQuantity(id, -1);
                });
            });
            document.querySelectorAll('.qty-plus').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    changeQuantity(id, 1);
                });
            });
            document.querySelectorAll('.cart-item-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    removeItemComplete(id);
                });
            });
        }

        function changeQuantity(productId, delta) {
            const itemIndex = cart.findIndex(i => i.id === productId);
            if (itemIndex === -1) return;
            const item = cart[itemIndex];
            const produtoOriginal = produtos.find(p => p.id === productId);
            const newQty = item.quantidade + delta;
            if (newQty < 1) {
                removeItemComplete(productId);
                return;
            }
            if (newQty > produtoOriginal.estoque) {
                showToast(`Estoque máximo atingido para ${produtoOriginal.nome} (${produtoOriginal.estoque} disponíveis)`, true);
                return;
            }
            item.quantidade = newQty;
            updateCartUI();
        }

        function removeItemComplete(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
            showToast("Item removido do carrinho");
        }

        function finalizarVenda() {
            if (cart.length === 0) {
                showToast("Carrinho vazio. Adicione produtos antes de finalizar.", true);
                return;
            }
            // Verificar novamente estoque para cada item (evitar inconsistência)
            let canFinish = true;
            for (let item of cart) {
                const original = produtos.find(p => p.id === item.id);
                if (original.estoque < item.quantidade) {
                    showToast(`Estoque insuficiente para ${original.nome}. Disponível: ${original.estoque}`, true);
                    canFinish = false;
                    break;
                }
            }
            if (!canFinish) return;
            // Atualizar estoque
            for (let item of cart) {
                const original = produtos.find(p => p.id === item.id);
                original.estoque -= item.quantidade;
            }
            const total = cart.reduce((acc, i) => acc + (i.preco * i.quantidade), 0);
            showToast(`✅ Venda finalizada! Total: R$ ${total.toFixed(2)}. Obrigado!`);
            // Limpar carrinho
            cart = [];
            updateCartUI();
            renderProducts(); // recarregar grid para mostrar estoques atualizados
            // Efeito de confete simples visual (apenas console feedback)
        }

        // Eventos
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderProducts();
        });
        checkoutBtn.addEventListener('click', finalizarVenda);
        
        // inicializar
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
