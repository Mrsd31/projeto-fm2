<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Santyus-SJ | Painel do Vendedor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            background: #000000dd;
            backdrop-filter: blur(12px);
            padding: 16px 0;
            border-bottom: 1px solid #2ecc7133;
            margin-bottom: 30px;
        }
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffffff 30%, #2ecc71 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #2ecc71;
        }
        .stat-card h3 {
            font-size: 2rem;
            color: #2ecc71;
        }
        .pedidos-list, .estoque-list {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .pedido-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #2ecc7133;
        }
        .badge-pendente { background: #ff9800; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-preparando { background: #2196f3; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .badge-entregue { background: #2ecc71; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; }
        .btn-status {
            background: #2ecc7122;
            border: 1px solid #2ecc71;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            color: white;
        }
        .btn-primary {
            background: #2ecc71;
            color: #000;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #2ecc7122;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #2ecc71;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            width: 80px;
        }
        .btn-green {
            background: #2ecc71;
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ecc71;
            color: #000;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .pedido-item { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container nav-content">
        <div class="logo">
            <h1>SANTYUS-SJ | VENDEDOR</h1>
        </div>
        <button class="btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Atualizar</button>
    </div>
</nav>

<div class="container">
    <h2 style="margin-bottom: 20px;">📊 Painel de Controle</h2>
    
    <div class="dashboard-cards">
        <div class="stat-card"><h3 id="totalPedidos">0</h3><p>Pedidos Hoje</p></div>
        <div class="stat-card"><h3 id="faturamentoDia">R$ 0</h3><p>Faturamento Hoje</p></div>
        <div class="stat-card"><h3 id="pedidosPendentes">0</h3><p>Pendentes</p></div>
        <div class="stat-card"><h3 id="totalProdutos">0</h3><p>Produtos no Estoque</p></div>
    </div>

    <div class="pedidos-list">
        <h3>📋 Gestão de Pedidos</h3>
        <div id="listaPedidos"></div>
    </div>

    <div class="estoque-list">
        <h3>📦 Controle de Estoque</h3>
        <table>
            <thead>
                <tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Ação</th></tr>
            </thead>
            <tbody id="estoqueLista"></tbody>
        </table>
    </div>

    <div class="pedidos-list">
        <h3>📈 Relatório de Vendas</h3>
        <button class="btn-primary" id="gerarRelatorioBtn"><i class="fas fa-chart-line"></i> Gerar Relatório</button>
        <div id="relatorioVendas" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    // ==================== DADOS ====================
    let produtos = [
        { id: 1, nome: "Smash Duplo", categoria: "Hambúrguer", preco: 32.90, estoque: 20 },
        { id: 2, nome: "Chicken Burger", categoria: "Hambúrguer", preco: 28.90, estoque: 15 },
        { id: 3, nome: "Burger Clássico", categoria: "Hambúrguer", preco: 24.90, estoque: 25 },
        { id: 4, nome: "BBQ Bacon", categoria: "Hambúrguer", preco: 34.90, estoque: 18 },
        { id: 5, nome: "Veggie Burger", categoria: "Hambúrguer", preco: 26.90, estoque: 10 },
        { id: 6, nome: "Monster Burger", categoria: "Hambúrguer", preco: 45.90, estoque: 12 },
        { id: 7, nome: "Batata Suprema", categoria: "Porção", preco: 22.90, estoque: 30 },
        { id: 8, nome: "Batata Frita", categoria: "Porção", preco: 15.90, estoque: 40 },
        { id: 9, nome: "Onion Rings", categoria: "Porção", preco: 18.90, estoque: 25 },
        { id: 10, nome: "Frango Crocante", categoria: "Porção", preco: 24.90, estoque: 20 },
        { id: 11, nome: "Pizza Mussarela", categoria: "Pizza", preco: 39.90, estoque: 8 },
        { id: 12, nome: "Pizza Calabresa", categoria: "Pizza", preco: 42.90, estoque: 8 },
        { id: 13, nome: "Coca-Cola 350ml", categoria: "Bebida", preco: 6.90, estoque: 50 },
        { id: 14, nome: "Milkshake", categoria: "Sobremesa", preco: 18.90, estoque: 15 },
        { id: 15, nome: "Petit Gateau", categoria: "Sobremesa", preco: 16.90, estoque: 12 }
    ];

    let pedidos = [
        { id: 101, cliente: "Carlos Silva", itens: [{nome:"Smash Duplo", qtd:2, preco:32.90}], total: 65.80, status: "pendente", data: new Date().toLocaleDateString(), hora: "19:30" },
        { id: 102, cliente: "Mariana Souza", itens: [{nome:"Chicken Burger", qtd:1, preco:28.90}], total: 28.90, status: "preparando", data: new Date().toLocaleDateString(), hora: "19:45" },
        { id: 103, cliente: "João Pedro", itens: [{nome:"Pizza Mussarela", qtd:1, preco:39.90}], total: 39.90, status: "entregue", data: new Date().toLocaleDateString(), hora: "18:30" }
    ];

    // Funções auxiliares
    function showToast(msg) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function atualizarDashboard() {
        const hoje = new Date().toLocaleDateString();
        const pedidosHoje = pedidos.filter(p => p.data === hoje);
        const faturamentoHoje = pedidosHoje.reduce((acc, p) => acc + p.total, 0);
        const pendentes = pedidos.filter(p => p.status === 'pendente').length;
        const totalEstoque = produtos.reduce((acc, p) => acc + p.estoque, 0);
        
        document.getElementById('totalPedidos').innerText = pedidosHoje.length;
        document.getElementById('faturamentoDia').innerText = `R$ ${faturamentoHoje.toFixed(2)}`;
        document.getElementById('pedidosPendentes').innerText = pendentes;
        document.getElementById('totalProdutos').innerText = totalEstoque;
    }

    function renderizarPedidos() {
        const container = document.getElementById('listaPedidos');
        if (!container) return;
        
        container.innerHTML = pedidos.map(p => `
            <div class="pedido-item" data-id="${p.id}">
                <div>
                    <strong>#${p.id}</strong> - ${p.cliente}<br>
                    ${p.itens.map(i => `${i.nome} x${i.qtd}`).join(', ')}<br>
                    <strong>Total: R$ ${p.total.toFixed(2)}</strong><br>
                    <small>${p.data} às ${p.hora}</small>
                </div>
                <div>
                    <span class="badge-${p.status}">${p.status.toUpperCase()}</span>
                    <select class="btn-status" data-id="${p.id}">
                        <option value="pendente" ${p.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="preparando" ${p.status === 'preparando' ? 'selected' : ''}>Preparando</option>
                        <option value="entregue" ${p.status === 'entregue' ? 'selected' : ''}>Entregue</option>
                    </select>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('.btn-status').forEach(select => {
            select.addEventListener('change', (e) => {
                const pedidoId = parseInt(select.dataset.id);
                const novoStatus = select.value;
                const pedido = pedidos.find(p => p.id === pedidoId);
                if (pedido) {
                    pedido.status = novoStatus;
                    showToast(`Pedido #${pedidoId} atualizado para ${novoStatus}`);
                    renderizarPedidos();
                    atualizarDashboard();
                }
            });
        });
    }

    function renderizarEstoque() {
        const tbody = document.getElementById('estoqueLista');
        tbody.innerHTML = produtos.map(p => `
            <tr>
                <td>${p.nome}</td>
                <td>${p.categoria}</td>
                <td><input type="number" id="estoque-${p.id}" value="${p.estoque}" min="0" style="width:80px"></td>
                <td><button class="btn-green" onclick="atualizarEstoque(${p.id})">Atualizar</button></td>
            </tr>
        `).join('');
    }

    window.atualizarEstoque = function(id) {
        const input = document.getElementById(`estoque-${id}`);
        const novoEstoque = parseInt(input.value);
        const produto = produtos.find(p => p.id === id);
        if (produto) {
            produto.estoque = novoEstoque;
            showToast(`Estoque de ${produto.nome} atualizado para ${novoEstoque}`);
            atualizarDashboard();
        }
    };

    function gerarRelatorio() {
        const totalVendas = pedidos.reduce((acc, p) => acc + p.total, 0);
        const produtosVendidos = {};
        pedidos.forEach(p => {
            p.itens.forEach(item => {
                produtosVendidos[item.nome] = (produtosVendidos[item.nome] || 0) + item.qtd;
            });
        });
        
        let relatorioHTML = `
            <p><strong>💰 Total de vendas (geral):</strong> R$ ${totalVendas.toFixed(2)}</p>
            <p><strong>📦 Total de pedidos realizados:</strong> ${pedidos.length}</p>
            <p><strong>🔥 Produtos mais vendidos:</strong></p>
            <ul>
        `;
        for (let [nome, qtd] of Object.entries(produtosVendidos)) {
            relatorioHTML += `<li>${nome}: ${qtd} unidades</li>`;
        }
        relatorioHTML += `</ul>`;
        document.getElementById('relatorioVendas').innerHTML = relatorioHTML;
        showToast('Relatório gerado com sucesso!');
    }

    function adicionarPedidoSimulado() {
        const novosItens = [{nome: "Batata Frita", qtd: 1, preco: 15.90}];
        const novoPedido = {
            id: pedidos.length + 101,
            cliente: "Novo Cliente",
            itens: novosItens,
            total: 15.90,
            status: "pendente",
            data: new Date().toLocaleDateString(),
            hora: new Date().toLocaleTimeString().slice(0,5)
        };
        pedidos.unshift(novoPedido);
        showToast(`Novo pedido #${novoPedido.id} recebido!`);
        renderizarPedidos();
        atualizarDashboard();
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
        renderizarPedidos();
        renderizarEstoque();
        atualizarDashboard();
        showToast('Dados atualizados!');
    });

    document.getElementById('gerarRelatorioBtn').addEventListener('click', gerarRelatorio);

    // Inicializar
    renderizarPedidos();
    renderizarEstoque();
    atualizarDashboard();

    // Simular novo pedido a cada 2 minutos (opcional)
    setInterval(() => {
        adicionarPedidoSimulado();
    }, 120000);
</script>
</body>
</html>
