<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Santyus-SJ | Painel do Vendedor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f23 100%);
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(46,204,113,0.15) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .login-card {
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(46,204,113,0.4);
            box-shadow: 0 0 40px rgba(46,204,113,0.2);
            z-index: 1;
        }
        .login-card h1 {
            font-size: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #2ecc71 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-card .subtitle {
            text-align: center;
            color: #2ecc71;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid #2ecc7133;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #000;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .error-msg {
            background: rgba(255,68,68,0.2);
            color: #ff8888;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .dashboard-container {
            display: none;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            background: #000000dd;
            backdrop-filter: blur(12px);
            padding: 16px 0;
            border-bottom: 1px solid #2ecc7133;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ffffff 30%, #2ecc71 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logout-btn {
            background: rgba(255,68,68,0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
        }
        .btn-primary {
            background: #2ecc71;
            color: #000;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #2ecc71;
            color: #2ecc71;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
        }
        .btn-danger {
            background: rgba(255,68,68,0.2);
            color: #ff6666;
            border: 1px solid #ff6666;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
        }
        .btn-red {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .btn-nota {
            background: #2196f3;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 5px;
        }
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #111;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #2ecc71;
        }
        .stat-card h3 {
            font-size: 2rem;
            color: #2ecc71;
        }
        .pedidos-list, .estoque-list {
            background: #111;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .pedidos-list h3, .estoque-list h3 {
            margin-bottom: 20px;
            color: #2ecc71;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pedido-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #2ecc7133;
        }
        .badge-pendente { background: #ff9800; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; }
        .badge-preparando { background: #2196f3; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; }
        .badge-entregue { background: #2ecc71; color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; }
        .badge-teste { background: #9c27b0; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.6rem; margin-left: 5px; }
        .btn-status {
            background: #2ecc7122;
            border: 1px solid #2ecc71;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2ecc7122;
        }
        th {
            color: #2ecc71;
        }
        input, select, textarea {
            background: #1a1a1a;
            border: 1px solid #2ecc71;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
        }
        .btn-green {
            background: #2ecc71;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 5px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ecc71;
            color: #000;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .add-product-bar {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .add-product-bar .field {
            display: flex;
            flex-direction: column;
        }
        .add-product-bar label {
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #aaa;
        }
        .add-product-bar input, .add-product-bar select, .add-product-bar textarea {
            width: 100%;
            padding: 10px;
            background: #0a0a0a;
        }
        .img-preview {
            max-width: 60px;
            max-height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .foto-upload-area {
            border: 2px dashed #2ecc71;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #0a0a0a;
        }
        .foto-upload-area:hover {
            border-color: #27ae60;
            background: #1a1a1a;
        }
        .foto-preview {
            max-width: 100px;
            max-height: 100px;
            border-radius: 12px;
            margin-top: 10px;
            display: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            border: 2px solid #2ecc71;
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }
        .nota-fiscal {
            background: white;
            color: #000;
            padding: 20px;
            border-radius: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .btn-imprimir {
            background: #2ecc71;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        .relatorio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .periodo-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .periodo-selector input {
            padding: 8px 12px;
        }
        .timer-reset {
            background: #1a1a1a;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #ff9800;
        }
        .notificacao-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1000;
            max-width: 350px;
        }
        .notificacao {
            background: #1a1a1a;
            border-left: 4px solid #ff9800;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideInRight 0.3s ease;
        }
        .notificacao.urgente { border-left-color: #ff4444; background: #2a1a1a; }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .pedido-item { flex-direction: column; gap: 12px; }
            table { font-size: 0.7rem; }
            th, td { padding: 6px; }
            .add-product-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <div class="login-card">
        <h1>SANTYUS-SJ</h1>
        <div class="subtitle">🔐 Área do Vendedor</div>
        <div class="input-group">
            <label>Usuário</label>
            <input type="text" id="loginUsername" placeholder="Digite seu usuário">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="Digite sua senha">
        </div>
        <button class="login-btn" onclick="fazerLogin()">Entrar</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<div id="dashboardScreen" class="dashboard-container">
    <nav class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <h1>SANTYUS-SJ | VENDEDOR</h1>
            </div>
            <button class="logout-btn" onclick="fazerLogout()">Sair</button>
        </div>
    </nav>

    <div class="container">
        <div id="notificacaoArea" class="notificacao-container"></div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
            <button class="btn-primary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Atualizar</button>
            <button class="btn-primary" id="addPedidoTesteBtn" style="background:#ff9800;"><i class="fas fa-flask"></i> Pedido Teste</button>
            <button class="btn-outline" id="gerarRelatorioBtn"><i class="fas fa-chart-line"></i> Atualizar Relatório</button>
        </div>

        <div class="dashboard-cards">
            <div class="stat-card"><h3 id="totalPedidos">0</h3><p>Pedidos Hoje</p></div>
            <div class="stat-card"><h3 id="faturamentoDia">R$ 0</h3><p>Faturamento Hoje</p></div>
            <div class="stat-card"><h3 id="pedidosPendentes">0</h3><p>Pendentes</p></div>
            <div class="stat-card"><h3 id="diasRestantesCard">0</h3><p>Dias de Acesso</p></div>
        </div>

        <div class="pedidos-list">
            <h3>📋 Pedidos Recebidos</h3>
            <div id="listaPedidos"></div>
        </div>

        <div class="estoque-list">
            <h3>📦 Controle de Estoque</h3>
            
            <!-- Formulário para ADICIONAR PRODUTO COM UPLOAD DE FOTO -->
            <div class="add-product-bar">
                <div class="field">
                    <label><i class="fas fa-tag"></i> Nome do Produto *</label>
                    <input type="text" id="novoProdutoNome" placeholder="Ex: Batata Especial">
                </div>
                <div class="field">
                    <label><i class="fas fa-layer-group"></i> Categoria</label>
                    <select id="novoProdutoCategoria">
                        <option value="Hambúrguer">🍔 Hambúrguer</option>
                        <option value="Porção">🍟 Porção</option>
                        <option value="Pizza">🍕 Pizza</option>
                        <option value="Bebida">🥤 Bebida</option>
                        <option value="Sobremesa">🍰 Sobremesa</option>
                    </select>
                </div>
                <div class="field">
                    <label><i class="fas fa-dollar-sign"></i> Preço (R$) *</label>
                    <input type="number" id="novoProdutoPreco" step="0.01" placeholder="0.00">
                </div>
                <div class="field">
                    <label><i class="fas fa-box"></i> Estoque Inicial</label>
                    <input type="number" id="novoProdutoEstoque" value="10" min="0">
                </div>
                <div class="field">
                    <label><i class="fas fa-align-left"></i> Descrição</label>
                    <textarea id="novoProdutoDesc" rows="2" placeholder="Descrição do produto"></textarea>
                </div>
                <div class="field">
                    <label><i class="fas fa-camera"></i> Foto do Produto</label>
                    <div class="foto-upload-area" id="fotoUploadArea">
                        <i class="fas fa-cloud-upload-alt"></i> Clique ou arraste uma imagem
                        <input type="file" id="novoProdutoFoto" accept="image/*" style="display: none;">
                    </div>
                    <img id="fotoPreview" class="foto-preview" alt="Preview da foto">
                </div>
                <div class="field">
                    <button class="btn-primary" id="adicionarProdutoBtn" style="margin-top: 23px;"><i class="fas fa-plus-circle"></i> Adicionar Produto</button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Foto</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="estoqueLista"></tbody>
                </table>
            </div>
        </div>

        <div class="pedidos-list">
            <h3>
                📈 Relatório de Vendas
                <span class="timer-reset" id="timerReset"><i class="fas fa-clock"></i> Reset automático: --:--:--</span>
            </h3>
            
            <div class="relatorio-header">
                <div class="periodo-selector">
                    <label>Visualizar:</label>
                    <select id="tipoRelatorio">
                        <option value="hoje">📅 Hoje</option>
                        <option value="ontem">📅 Ontem</option>
                        <option value="semana">📆 Últimos 7 dias</option>
                        <option value="mes">📆 Este Mês</option>
                        <option value="personalizado">📅 Personalizado</option>
                    </select>
                    <div id="dataRange" style="display: none;">
                        <input type="date" id="dataInicio">
                        <span>até</span>
                        <input type="date" id="dataFim">
                    </div>
                    <button class="btn-outline" id="aplicarPeriodoBtn" style="padding: 5px 15px;">Aplicar</button>
                </div>
                <div>
                    <label style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="excluirTestesCheckbox"> Excluir pedidos de teste
                    </label>
                </div>
            </div>
            
            <div id="relatorioVendas"></div>
            
            <div style="margin-top: 15px; text-align: center;">
                <button class="btn-primary" id="exportarRelatorioBtn" style="background: #2196f3;"><i class="fas fa-download"></i> Exportar Relatório (CSV)</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal da Nota Fiscal -->
<div id="notaModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="fecharModal('notaModal')">&times;</span>
        <div id="conteudoNota"></div>
        <button class="btn-imprimir" onclick="imprimirNota()"><i class="fas fa-print"></i> Imprimir Nota Fiscal</button>
    </div>
</div>

<script>
    let vendedorAtual = null;
    let produtos = [];
    let pedidos = [];
    let currentNotaData = null;
    let intervaloRelogio = null;
    let nextProdutoId = 1;
    let fotoSelecionada = null;

    // ==================== UPLOAD DE FOTO ====================
    function setupFotoUpload() {
        const uploadArea = document.getElementById('fotoUploadArea');
        const fileInput = document.getElementById('novoProdutoFoto');
        const preview = document.getElementById('fotoPreview');

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#27ae60';
            uploadArea.style.background = '#1a1a1a';
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#2ecc71';
            uploadArea.style.background = '#0a0a0a';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#2ecc71';
            uploadArea.style.background = '#0a0a0a';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processarFoto(file);
            } else {
                showToast('❌ Por favor, selecione uma imagem válida!');
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                processarFoto(e.target.files[0]);
            }
        });
    }

    function processarFoto(file) {
        if (!file.type.startsWith('image/')) {
            showToast('❌ Por favor, selecione uma imagem válida!');
            return;
        }
        
        const reader = new FileReader();
        reader.onload = (e) => {
            fotoSelecionada = e.target.result;
            const preview = document.getElementById('fotoPreview');
            preview.src = fotoSelecionada;
            preview.style.display = 'block';
            document.getElementById('fotoUploadArea').style.borderColor = '#2ecc71';
        };
        reader.readAsDataURL(file);
    }

    // ==================== BANCO DE DADOS HISTÓRICO ====================
    function salvarPedidoHistorico(pedido) {
        let historico = localStorage.getItem('santyus_historico_vendas');
        let historicoArray = historico ? JSON.parse(historico) : [];
        historicoArray.push({
            ...pedido,
            dataArquivamento: new Date().toISOString()
        });
        localStorage.setItem('santyus_historico_vendas', JSON.stringify(historicoArray));
    }

    function carregarHistoricoVendas() {
        const historico = localStorage.getItem('santyus_historico_vendas');
        return historico ? JSON.parse(historico) : [];
    }

    // ==================== RESET DIÁRIO ====================
    function verificarResetDiario() {
        const hoje = new Date().toLocaleDateString();
        const ultimoReset = localStorage.getItem('santyus_ultimo_reset_data');
        
        if (ultimoReset !== hoje) {
            const pedidosHoje = pedidos.filter(p => p.data === ultimoReset);
            if (pedidosHoje.length > 0) {
                pedidosHoje.forEach(p => {
                    if (!p.arquivado) {
                        salvarPedidoHistorico(p);
                        p.arquivado = true;
                    }
                });
            }
            localStorage.setItem('santyus_ultimo_reset_data', hoje);
            localStorage.setItem('santyus_pedidos', JSON.stringify(pedidos));
            return true;
        }
        return false;
    }

    function inicializarResetDiario() {
        if (!localStorage.getItem('santyus_ultimo_reset_data')) {
            localStorage.setItem('santyus_ultimo_reset_data', new Date().toLocaleDateString());
        }
    }

    // ==================== RELATÓRIO ====================
    function getPedidosPorPeriodo(tipo, dataInicioStr, dataFimStr) {
        let todosPedidos = [...pedidos, ...carregarHistoricoVendas()];
        const uniquePedidos = [];
        const ids = new Set();
        for (const p of todosPedidos) {
            if (!ids.has(p.id)) {
                ids.add(p.id);
                uniquePedidos.push(p);
            }
        }
        todosPedidos = uniquePedidos;
        
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        let dataInicio, dataFim;
        
        switch(tipo) {
            case 'hoje':
                dataInicio = hoje;
                dataFim = new Date(hoje);
                dataFim.setHours(23, 59, 59);
                break;
            case 'ontem':
                dataInicio = new Date(hoje);
                dataInicio.setDate(hoje.getDate() - 1);
                dataFim = new Date(dataInicio);
                dataFim.setHours(23, 59, 59);
                break;
            case 'semana':
                dataInicio = new Date(hoje);
                dataInicio.setDate(hoje.getDate() - 7);
                dataFim = new Date(hoje);
                dataFim.setHours(23, 59, 59);
                break;
            case 'mes':
                dataInicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
                dataFim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
                dataFim.setHours(23, 59, 59);
                break;
            case 'personalizado':
                if (!dataInicioStr || !dataFimStr) return [];
                dataInicio = new Date(dataInicioStr);
                dataFim = new Date(dataFimStr);
                dataFim.setHours(23, 59, 59);
                break;
            default: return [];
        }
        
        return todosPedidos.filter(p => {
            if (!p.data) return false;
            const partes = p.data.split('/');
            const dataPedido = new Date(partes[2], partes[1]-1, partes[0]);
            return dataPedido >= dataInicio && dataPedido <= dataFim;
        });
    }

    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

                        <p style="color:#aaa;">💰 Total de Vendas</p>

                    </div>
                    <div style="text-align:center; padding:15px; background:#0a0a0a; border-radius:12px;">
                        <p style="color:#aaa;">📦 Total de Pedidos</p>
                        <h2 style="color:#2ecc71;">${totalPedidos}</h2>
                    </div>
                    <div style="text-align:center; padding:15px; background:#0a0a0a; border-radius:12px;">
                        <p style="color:#aaa;">⭐ Ticket Médio</p>
                        <h2 style="color:#2ecc71;">${formatarMoeda(totalPedidos > 0 ? totalVendas / totalPedidos : 0)}</h2>

                <div style="margin-top: 20px;">

    function exportarRelatorioCSV() {
        const tipo = document.getElementById('tipoRelatorio').value;
        const excluirTestes = document.getElementById('excluirTestesCheckbox').checked;
        const dataInicio = document.getElementById('dataInicio').value;
        const dataFim = document.getElementById('dataFim').value;
        
        let pedidosFiltrados = getPedidosPorPeriodo(tipo, dataInicio, dataFim);
        if (excluirTestes) pedidosFiltrados = pedidosFiltrados.filter(p => !p.isTeste);
        
        let csvContent = "ID Pedido,Cliente,Data,Total,Status,Pagamento,Itens\n";
        pedidosFiltrados.forEach(p => {
            const itensStr = p.itens.map(i => `${i.nome} x${i.qtd}`).join('; ');
            csvContent += `"${p.id}","${p.cliente}","${p.data}","${p.total}","${p.status}","${p.pagamento || 'Dinheiro'}","${itensStr}"\n`;
        });
        
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `relatorio_vendas_${new Date().toISOString().slice(0,19)}.csv`);
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('📊 Relatório exportado com sucesso!');
    }

    function atualizarTimer() {
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        function update() {
            const agora = new Date();
            const amanhaMeiaNoite = new Date(agora);
            amanhaMeiaNoite.setDate(agora.getDate() + 1);
            amanhaMeiaNoite.setHours(0, 0, 0, 0);
            const diffMs = amanhaMeiaNoite - agora;
            const horas = Math.floor(diffMs / (1000 * 60 * 60));
            const minutos = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diffMs % (1000 * 60)) / 1000);
            const timerElement = document.getElementById('timerReset');
            if (timerElement) {
                timerElement.innerHTML = `<i class="fas fa-clock"></i> Reset automático: ${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            }
        }
        update();
        intervaloRelogio = setInterval(update, 1000);
    }

    // ==================== GERENCIAMENTO DE PRODUTOS ====================
    function adicionarProduto() {
        const nome = document.getElementById('novoProdutoNome').value.trim();
        const categoria = document.getElementById('novoProdutoCategoria').value;
        const preco = parseFloat(document.getElementById('novoProdutoPreco').value);
        const estoque = parseInt(document.getElementById('novoProdutoEstoque').value);
        const desc = document.getElementById('novoProdutoDesc').value.trim();

        if (!nome) { showToast('❌ Digite o nome do produto!'); return; }
        if (isNaN(preco) || preco <= 0) { showToast('❌ Digite um preço válido!'); return; }
        if (isNaN(estoque) || estoque < 0) { showToast('❌ Digite um estoque válido!'); return; }

        let fotoUrl = 'https://via.placeholder.com/400x200?text=Sem+Foto';
        if (fotoSelecionada) {
            fotoUrl = fotoSelecionada;
        }

        const novoProduto = {
            id: nextProdutoId++,
            nome: nome,
            categoria: categoria,
            preco: preco,
            estoque: estoque,
            img: fotoUrl,
            desc: desc || 'Sem descrição'
        };
        produtos.push(novoProduto);
        salvarProdutos();
        renderizarEstoque();
        showToast(`✅ Produto "${nome}" adicionado com sucesso!`);

        // Limpar formulário
        document.getElementById('novoProdutoNome').value = '';
        document.getElementById('novoProdutoPreco').value = '';
        document.getElementById('novoProdutoEstoque').value = '10';
        document.getElementById('novoProdutoDesc').value = '';
        document.getElementById('fotoPreview').style.display = 'none';
        document.getElementById('fotoPreview').src = '';
        fotoSelecionada = null;
        document.getElementById('novoProdutoFoto').value = '';
    }

    function removerProduto(id) {
        const produto = produtos.find(p => p.id === id);
        if (produto && confirm(`Tem certeza que deseja remover "${produto.nome}" do estoque?`)) {
            produtos = produtos.filter(p => p.id !== id);
            salvarProdutos();
            renderizarEstoque();
            showToast(`🗑️ Produto "${produto.nome}" removido!`);
        }
    }

    function atualizarEstoqueProduto(id) {
        const input = document.getElementById(`estoque-${id}`);
        const novoEstoque = parseInt(input.value);
        const produto = produtos.find(p => p.id === id);
        if (produto && !isNaN(novoEstoque)) {
            produto.estoque = novoEstoque;
            salvarProdutos();
            renderizarEstoque();
            showToast(`Estoque de ${produto.nome} atualizado para ${novoEstoque}`);
        }
    }

    // ==================== FUNÇÕES DA NOTA FISCAL ====================
    function gerarChaveAcesso() {
        const parte1 = Date.now().toString();
        const parte2 = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        return `${parte1}${parte2}`.slice(0, 44);
    }

                    <p>CNPJ: 12.345.678/0001-90 | IE: 123.456.789.000</p>
                    <p>Tel: (21) 95941-6937</p>
                </div>
                <div style="text-align:center; margin:15px 0;">
                    <h3>NOTA FISCAL</h3>
                    <p><strong>Nº ${numeroNF}</strong></p>
                </div>

                <tr><td colspan="4" style="text-align:right"><strong>Total</strong></td><td><strong>R$ ${pedido.total.toFixed(2)}</strong></td></tr></tbody>
            </table>

    function imprimirNota() {
        if (currentNotaData) {
            const win = window.open('', '_blank');
            win.document.write(`<html><head><title>Nota Fiscal ${currentNotaData.numeroNF}</title>
                <style>body{font-family:'Courier New',monospace;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:8px;}</style>
                </head><body>${currentNotaData.html}</body></html>`);
            win.document.close();
            win.print();
        }

    // ==================== FUNÇÕES PRINCIPAIS ====================
    function calcularDiasRestantes(dataExpiracao) {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const expiracao = new Date(dataExpiracao); expiracao.setHours(0,0,0,0);
        return Math.ceil((expiracao - hoje) / (1000 * 60 * 60 * 24));
    }

    function carregarProdutos() {
        const saved = localStorage.getItem('santyus_produtos');
        if (saved) {
            produtos = JSON.parse(saved);
            nextProdutoId = Math.max(...produtos.map(p => p.id), 0) + 1;
        } else {
            produtos = [
                { id: 1, nome: "Smash Duplo", categoria: "Hambúrguer", preco: 32.90, estoque: 20, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&h=200&fit=crop", desc: "" },
                { id: 2, nome: "Chicken Burger", categoria: "Hambúrguer", preco: 28.90, estoque: 15, img: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=400&h=200&fit=crop", desc: "" },
                { id: 3, nome: "Batata Suprema", categoria: "Porção", preco: 22.90, estoque: 30, img: "https://images.unsplash.com/photo-1630384060421-cf20c0e0643f?w=400&h=200&fit=crop", desc: "" }
            ];
            salvarProdutos();
            nextProdutoId = 4;
        }
    }

    function carregarPedidos() {
        const saved = localStorage.getItem('santyus_pedidos');
        if (saved) pedidos = JSON.parse(saved);
        else pedidos = [];
        verificarResetDiario();
    }

    function salvarProdutos() { localStorage.setItem('santyus_produtos', JSON.stringify(produtos)); }
    function salvarPedidos() { localStorage.setItem('santyus_pedidos', JSON.stringify(pedidos)); }

    function showToast(msg, duration = 3000) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), duration);
    }

    function atualizarDashboard() {
        const hoje = new Date().toLocaleDateString();
        const pedidosHoje = pedidos.filter(p => p.data === hoje && !p.isTeste);
        const faturamentoHoje = pedidosHoje.reduce((acc, p) => acc + p.total, 0);
        const pendentes = pedidos.filter(p => p.status === 'pendente').length;
        document.getElementById('totalPedidos').innerText = pedidosHoje.length;
        document.getElementById('faturamentoDia').innerText = `R$ ${faturamentoHoje.toFixed(2)}`;
        document.getElementById('pedidosPendentes').innerText = pendentes;
    }

    function renderizarPedidos() {
        const container = document.getElementById('listaPedidos');
        if (pedidos.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;">Nenhum pedido</div>';
            return;
        }
        container.innerHTML = pedidos.map(p => `
            <div class="pedido-item">
                <div><strong>#${p.id}</strong> - ${p.cliente} ${p.isTeste ? '<span class="badge-teste">TESTE</span>' : ''}<br>
                ${p.itens.map(i => `${i.nome} x${i.qtd}`).join(', ')}<br>Total: R$ ${p.total.toFixed(2)}<br><small>${p.data} ${p.hora || ''}</small></div>
                <div>
                    <span class="badge-${p.status}">${p.status}</span>
                    <select class="btn-status" data-id="${p.id}">
                        <option value="pendente" ${p.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="preparando" ${p.status === 'preparando' ? 'selected' : ''}>Preparando</option>
                        <option value="entregue" ${p.status === 'entregue' ? 'selected' : ''}>Entregue</option>
                    </select>
                    <button class="btn-nota" onclick='abrirNotaFiscal(${JSON.stringify(p).replace(/'/g, "\\'")})'><i class="fas fa-file-invoice"></i> NF</button>
                    ${p.isTeste ? `<button class="btn-danger" onclick="removerPedidoTeste(${p.id})" style="margin-left:5px;"><i class="fas fa-trash"></i></button>` : ''}
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.btn-status').forEach(select => {
            select.addEventListener('change', (e) => {
                const id = parseInt(select.dataset.id);
                const pedido = pedidos.find(p => p.id === id);
                if (pedido) {
                    pedido.status = select.value;
                    salvarPedidos();
                    renderizarPedidos();
                    atualizarDashboard();
                    atualizarRelatorio();
                    showToast(`Pedido #${id} atualizado para ${pedido.status}`);
                }
            });
        });
    }

    function removerPedidoTeste(id) {
        if (confirm('Remover este pedido de teste?')) {
            pedidos = pedidos.filter(p => p.id !== id);
            salvarPedidos();
            renderizarPedidos();
            atualizarDashboard();
            atualizarRelatorio();
            showToast('Pedido de teste removido!');
        }
    }

    function renderizarEstoque() {
        const tbody = document.getElementById('estoqueLista');
        tbody.innerHTML = produtos.map(p => `
            <tr>
                <td>${p.id}</td>
                <td><img src="${p.img}" class="img-preview" onerror="this.src='https://via.placeholder.com/50?text=Sem+Foto'"></td>
                <td>${p.nome}</td>
                <td>${p.categoria}</td>
                <td>R$ ${p.preco.toFixed(2)}</td>
                <td><input type="number" id="estoque-${p.id}" value="${p.estoque}" min="0" style="width:80px"></td>
                <td>
                    <button class="btn-green" onclick="atualizarEstoqueProduto(${p.id})"><i class="fas fa-save"></i></button>
                    <button class="btn-red" onclick="removerProduto(${p.id})"><i class="fas fa-trash"></i></button>
                  </td>
            </tr>
        `).join('');
    }

    function carregarDadosVendedor() {
        const savedVendedor = localStorage.getItem('santyus_vendedor_atual');
        if (savedVendedor) {
            vendedorAtual = JSON.parse(savedVendedor);
            const diasRestantes = calcularDiasRestantes(vendedorAtual.dataExpiracao);
            document.getElementById('diasRestantesCard').innerHTML = `${diasRestantes > 0 ? diasRestantes : 0}`;
            if (diasRestantes <= 0) document.getElementById('diasRestantesCard').style.color = '#ff4444';
            else if (diasRestantes <= 5) document.getElementById('diasRestantesCard').style.color = '#ff9800';
            else document.getElementById('diasRestantesCard').style.color = '#2ecc71';
        }
    }

    function carregarDados() {
        carregarProdutos();
        carregarPedidos();
        inicializarResetDiario();
        verificarResetDiario();
        renderizarPedidos();
        renderizarEstoque();
        atualizarDashboard();
        atualizarRelatorio();
        carregarDadosVendedor();
        atualizarTimer();
    }

    function fazerLogin() {
        const user = document.getElementById('loginUsername').value;
        const pass = document.getElementById('loginPassword').value;
        const vendedoresSalvos = localStorage.getItem('santyus_vendedores');
        let vendedorEncontrado = null;
        if (vendedoresSalvos) {
            const vendedores = JSON.parse(vendedoresSalvos);
            vendedorEncontrado = vendedores.find(v => v.login === user && v.senha === pass && v.status === 'ativo');
        }
        if (vendedorEncontrado || (user === "vendedor" && pass === "venda123")) {
            if (!vendedorEncontrado) {
                vendedorEncontrado = { id: 1, nome: "Vendedor", login: "vendedor", dataExpiracao: new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0] };
            }
            localStorage.setItem('santyus_vendedor_atual', JSON.stringify({
                id: vendedorEncontrado.id, nome: vendedorEncontrado.nome,
                login: vendedorEncontrado.login, dataExpiracao: vendedorEncontrado.dataExpiracao
            }));
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            carregarDados();
        } else {
            document.getElementById('loginError').innerText = '❌ Acesso negado. Verifique suas credenciais.';
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function fazerLogout() {
        localStorage.removeItem('santyus_vendedor_atual');
        if (intervaloRelogio) clearInterval(intervaloRelogio);
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboardScreen').style.display = 'none';
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginError').style.display = 'none';
    }

    function fecharModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // Eventos
    document.getElementById('refreshBtn').addEventListener('click', carregarDados);
    document.getElementById('gerarRelatorioBtn').addEventListener('click', () => atualizarRelatorio());
    document.getElementById('aplicarPeriodoBtn').addEventListener('click', () => atualizarRelatorio());
    document.getElementById('exportarRelatorioBtn').addEventListener('click', exportarRelatorioCSV);
    document.getElementById('adicionarProdutoBtn').addEventListener('click', adicionarProduto);
    document.getElementById('tipoRelatorio').addEventListener('change', (e) => {
        const dataRange = document.getElementById('dataRange');
        dataRange.style.display = e.target.value === 'personalizado' ? 'flex' : 'none';
        if (e.target.value !== 'personalizado') atualizarRelatorio();
    });
    document.getElementById('excluirTestesCheckbox').addEventListener('change', () => atualizarRelatorio());
    document.getElementById('addPedidoTesteBtn').addEventListener('click', () => {
        const produtoAleatorio = produtos.length > 0 ? produtos[Math.floor(Math.random() * produtos.length)] : null;
        const novoPedido = {
            id: Date.now(),
            cliente: `TESTE - ${Math.floor(Math.random() * 100)}`,
            endereco: "Rua Teste, 123",
            telefone: "(00) 00000-0000",
            itens: [{ nome: produtoAleatorio?.nome || "Produto Teste", qtd: 1, preco: produtoAleatorio?.preco || 25.90 }],
            total: produtoAleatorio?.preco || 25.90,
            status: "entregue",
            pagamento: "Dinheiro",
            isTeste: true,
            data: new Date().toLocaleDateString(),
            hora: new Date().toLocaleTimeString().slice(0,5)
        };
        pedidos.unshift(novoPedido);
        salvarPedidos();
        renderizarPedidos();
        atualizarDashboard();
        atualizarRelatorio();
        showToast('Pedido de teste adicionado');
    });
    document.getElementById('loginPassword').addEventListener('keypress', e => { if(e.key === 'Enter') fazerLogin(); });
    window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; };
    
    // Inicializar upload de foto
    setupFotoUpload();
    
    // Tornar funções globais
    window.removerProduto = removerProduto;
    window.atualizarEstoqueProduto = atualizarEstoqueProduto;
    window.removerPedidoTeste = removerPedidoTeste;
    window.abrirNotaFiscal = abrirNotaFiscal;
</script>
